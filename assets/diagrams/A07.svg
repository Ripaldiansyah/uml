<g data-shape="fix" data-kind="action"><rect x="70" y="820" width="220" height="58" rx="9" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.2"/><text x="180" y="845.5" fill="#333333" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" text-anchor="middle"><tspan x="180" dy="0">Baca penjelasan, lalu perbaiki</tspan><tspan x="180" dy="15">data pribadi</tspan></text></g>
