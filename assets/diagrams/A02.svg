<title id="A02t">Aktivitas masuk ke akun</title>
<desc id="A02d">Aktivitas masuk ke akun. Pengguna dan sistem melakukan kegiatan secara berurutan; cabang dan pengulangan ditunjukkan dengan panah.</desc>
