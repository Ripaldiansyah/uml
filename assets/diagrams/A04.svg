<g data-shape="save" data-kind="action"><rect x="430" y="470" width="250" height="58" rx="9" fill="#d5e8d4" stroke="#82b366" stroke-width="1.2"/><text x="555" y="495.5" fill="#333333" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" text-anchor="middle"><tspan x="555" dy="0">Simpan gejala baru atau ganti gejala</tspan><tspan x="555" dy="15">lama</tspan></text></g>
