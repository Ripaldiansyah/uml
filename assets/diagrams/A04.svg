<title id="A04t">Aktivitas mengelola gejala dan pertanyaan</title>
<desc id="A04d">Aktivitas mengelola gejala dan pertanyaan. Admin dan sistem melakukan kegiatan secara berurutan; cabang dan pengulangan ditunjukkan dengan panah.</desc>
