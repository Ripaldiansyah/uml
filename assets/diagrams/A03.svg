<g data-shape="st" data-kind="start"><circle cx="180" cy="61" r="10" fill="#333333" stroke="#333333"/></g>
<g data-shape="fill" data-kind="action"><rect x="70" y="100" width="220" height="58" rx="9" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.2"/><text x="180" y="118" fill="#333333" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" text-anchor="middle"><tspan x="180" dy="0">Isi nama pemilik, merek motor,</tspan><tspan x="180" dy="15">nomor kendaraan, dan jarak</tspan><tspan x="180" dy="15">tempuh</tspan></text></g>
<g data-shape="check" data-kind="action"><rect x="430" y="100" width="250" height="58" rx="9" fill="#d5e8d4" stroke="#82b366" stroke-width="1.2"/><text x="555" y="133" fill="#333333" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" text-anchor="middle"><tspan x="555" dy="0">Periksa isian utama konsultasi</tspan></text></g>
<g data-shape="valid" data-kind="decision"><path d="M555 210L660 254L555 298L450 254Z" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.3"/><text x="555" y="258" fill="#333333" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" text-anchor="middle"><tspan x="555" dy="0">Isian utama sudah lengkap?</tspan></text></g>
<g data-shape="fix" data-kind="action"><rect x="70" y="210" width="220" height="58" rx="9" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.2"/><text x="180" y="235.5" fill="#333333" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" text-anchor="middle"><tspan x="180" dy="0">Baca penjelasan, lalu perbaiki</tspan><tspan x="180" dy="15">isian utama</tspan></text></g>
<g data-shape="target" data-kind="action"><rect x="70" y="360" width="220" height="58" rx="9" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.2"/><text x="180" y="385.5" fill="#333333" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" text-anchor="middle"><tspan x="180" dy="0">Pilih gangguan yang dicurigai,</tspan><tspan x="180" dy="15">atau pilih Belum tahu</tspan></text></g>
<g data-shape="ready" data-kind="action"><rect x="430" y="360" width="250" height="58" rx="9" fill="#d5e8d4" stroke="#82b366" stroke-width="1.2"/><text x="555" y="378" fill="#333333" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" text-anchor="middle"><tspan x="555" dy="0">Pastikan ada aturan aktif; bila belum</tspan><tspan x="555" dy="15">ada, berikan penjelasan untuk</tspan><tspan x="555" dy="15">menghubungi admin</tspan></text></g>
<g data-shape="find" data-kind="action"><rect x="430" y="490" width="250" height="58" rx="9" fill="#d5e8d4" stroke="#82b366" stroke-width="1.2"/><text x="555" y="515.5" fill="#333333" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" text-anchor="middle"><tspan x="555" dy="0">Cari aturan yang sesuai dan pilih</tspan><tspan x="555" dy="15">pertanyaan yang belum terjawab</tspan></text></g>
<g data-shape="more" data-kind="decision"><path d="M555 600L660 644L555 688L450 644Z" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.3"/><text x="555" y="640.5" fill="#333333" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" text-anchor="middle"><tspan x="555" dy="0">Ada pertanyaan yang perlu</tspan><tspan x="555" dy="13.75">dijawab?</tspan></text></g>
<g data-shape="answer" data-kind="action"><rect x="70" y="760" width="220" height="58" rx="9" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.2"/><text x="180" y="785.5" fill="#333333" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" text-anchor="middle"><tspan x="180" dy="0">Jawab ya atau tidak; jawaban</tspan><tspan x="180" dy="15">sebelumnya dapat diubah</tspan></text></g>
<g data-shape="save" data-kind="action"><rect x="430" y="760" width="250" height="58" rx="9" fill="#d5e8d4" stroke="#82b366" stroke-width="1.2"/><text x="555" y="785.5" fill="#333333" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" text-anchor="middle"><tspan x="555" dy="0">Simpan jawaban dan langkah</tspan><tspan x="555" dy="15">pemeriksaan</tspan></text></g>
<g data-shape="enough" data-kind="decision"><path d="M555 890L660 934L555 978L450 934Z" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.3"/><text x="555" y="930.5" fill="#333333" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" text-anchor="middle"><tspan x="555" dy="0">Gangguan yang cocok sudah</tspan><tspan x="555" dy="13.75">ditemukan?</tspan></text></g>
<g data-shape="cost" data-kind="action"><rect x="430" y="1070" width="250" height="58" rx="9" fill="#d5e8d4" stroke="#82b366" stroke-width="1.2"/><text x="555" y="1095.5" fill="#333333" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" text-anchor="middle"><tspan x="555" dy="0">Hitung biaya jasa dan suku cadang</tspan><tspan x="555" dy="15">yang dianjurkan</tspan></text></g>
<g data-shape="advice" data-kind="action"><rect x="430" y="1170" width="250" height="58" rx="9" fill="#d5e8d4" stroke="#82b366" stroke-width="1.2"/><text x="555" y="1195.5" fill="#333333" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" text-anchor="middle"><tspan x="555" dy="0">Simpan hasil; tampilkan gangguan,</tspan><tspan x="555" dy="15">perkiraan biaya, dan saran</tspan></text></g>
<g data-shape="print" data-kind="action"><rect x="70" y="1250" width="220" height="58" rx="9" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.2"/><text x="180" y="1283" fill="#333333" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" text-anchor="middle"><tspan x="180" dy="0">Cetak atau unduh perintah kerja</tspan></text></g>
<g data-shape="finish" data-kind="end"><circle cx="NaN" cy="1293" r="12" fill="#ffffff" stroke="#333333" stroke-width="2"/><circle cx="NaN" cy="1293" r="7" fill="#333333"/></g>
</svg>
