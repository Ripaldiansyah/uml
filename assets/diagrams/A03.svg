<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1370" role="img" aria-labelledby="A03t A03d">
<title id="A03t">Aktivitas memeriksa gangguan motor</title>
<desc id="A03d">Aktivitas memeriksa gangguan motor. Pelanggan dan sistem melakukan kegiatan secara berurutan; cabang dan pengulangan ditunjukkan dengan panah.</desc>
<rect width="760" height="1370" fill="#ffffff"/>
<defs>
